<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | INOFORM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../static/cad.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="../cad.js" defer></script>
  </head>
<body>
  <header class="topo">
    <a href="index.html" class="logo" aria-label="Voltar para a página inicial">
      <img src="../imagens/MaisImagens/Logo.png" alt="Logo da INOFORM">
    </a>
  </header>

  <main>
    <section class="boas-vindas" aria-hidden="false">
      <h2>Cadastre sua conta</h2>
      <p>Crie sua conta em menos de um minuto e compre com mais praticidade.</p>
      <ul class="vantagens">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#181574" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>Acompanhe seus pedidos</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#181574" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>Salve seus produtos favoritos</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#181574" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>Veja as ofertas antes de todo mundo</li>
      </ul>
    </section>

    <section class="card">
      <h1>Criar conta</h1>
      <p class="sub">Preencha os dados abaixo para se cadastrar.</p>

      <form action="#" method="post" id="form" novalidate>
        <div class="campo">
          <label for="nome">Nome de usuário</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome de usuário" required autocomplete="username" aria-describedby="erro-nome">
          <p class="erro" id="erro-nome"></p>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@email.com" required autocomplete="email" inputmode="email" aria-describedby="erro-email">
          <p class="erro" id="erro-email"></p>
        </div>

        <div class="duas-colunas">
          <div class="campo">
            <label for="senha">Senha</label>
            <div class="entrada">
              <input type="password" id="senha" name="senha" placeholder="Mín. 6 caracteres" minlength="6" required autocomplete="new-password" aria-describedby="forca erro-senha">
              <button type="button" class="olho" aria-label="Mostrar senha" aria-pressed="false" data-alvo="senha">
                <svg class="aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0112 19C5 19 1 12 1 12a18.5 18.5 0 015.1-5.9M9.9 5.1A10.9 10.9 0 0112 5c7 0 11 7 11 7a18.5 18.5 0 01-2.2 3.2M1 1l22 22"/></svg>
              </button>
            </div>
            <p class="erro" id="erro-senha"></p>
          </div>

          <div class="campo">
            <label for="confirmar">Confirmar senha</label>
            <div class="entrada">
              <input type="password" id="confirmar" name="confirmar" placeholder="Repita a senha" required autocomplete="new-password" aria-describedby="erro">
              <button type="button" class="olho" aria-label="Mostrar senha" aria-pressed="false" data-alvo="confirmar">
                <svg class="aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0112 19C5 19 1 12 1 12a18.5 18.5 0 015.1-5.9M9.9 5.1A10.9 10.9 0 0112 5c7 0 11 7 11 7a18.5 18.5 0 01-2.2 3.2M1 1l22 22"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="forca" id="forca" data-n="0" aria-live="polite">
          <div class="barras"><i></i><i></i><i></i><i></i></div>
          <span id="forca-texto"></span>
        </div>
        <p class="erro" id="erro" role="alert"></p>
        <p class="sucesso" id="sucesso" role="status" aria-live="polite"></p>

        <label class="termos">
          <input type="checkbox" name="termos" id="termos" required>
          <span>Li e aceito os <a href="#">termos de uso</a>.</span>
        </label>
        <p class="erro" id="erro-termos" style="margin-top:-12px;margin-bottom:12px"></p>

        <button type="submit" class="botao">Criar conta</button>
      </form>

      <p class="rodape">Já tem conta? <a href="login.html">Entrar</a></p>
    </section>
  </main>
</body>
</html>

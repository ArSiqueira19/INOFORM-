<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inoform - Carrinho</title>
<link rel="stylesheet" href="../static/carrinho.css">
<link rel="stylesheet" href="../static/style.css">

<script src="../carrinho.js" defer></script>
<script src="../produtos.js" defer></script>
    <script src="../banner.js" defer></script>
    <script src="../carrosel.js" defer></script>
    <script src="../barra-pesquisa.js" defer></script>
    <script src="../pagina-produtos.js" defer></script>
</head>
<body>

<header>
         <a href="index.html" class="logo">
        <div class="logo">
            <img src="../imagens/MaisImagens/Logo.png" alt="Logo da HORIZON">
        </div>
        </a> 

        <div class="barra-pesquisa">
            <input type="text" id="campo-pesquisa" placeholder="Pesquisar" autocomplete="off">
            <button type="button" id="botao-pesquisa">Pesquisar</button>
            <ul id="resultados-pesquisa" class="resultados-pesquisa"></ul>
        </div>

        <div class="icones">
            <img id="btnUsuario" src="../imagens/MaisImagens/Login.png" alt="Ícone de Perfil">
            <img id="btnCarrinho" src="../imagens/MaisImagens/Carrinho.png" alt="Ícone de Carrinho">
        </div>
    </header>

    <!-- MENU -->
    <nav>
        <a href="#">INÍCIO</a>
        <a href="#">SKATE</a>
        <a href="#">BMX</a>
        <a href="#">ROUPAS</a>
        <a href="#">ACESSÓRIOS</a>
        <a href="#">MARCAS</a>
    </nav>

<main>
  <section class="caixa">
    <svg viewBox="40 30 640 560" role="img" aria-label="Carrinho vazio" fill="none" stroke="#6b6b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M148 183H205Q213 183 215 195L222 253"/>
      <path d="M222 253H525Q529 253 528 262L500 450H245Z"/>
      <circle cx="263" cy="536" r="18"/><circle cx="482" cy="536" r="18"/>
      <path d="M108 563H632M55 563H90M655 563H665"/>
      <circle cx="539" cy="60" r="11" stroke-width="3"/>
      <path d="M428 122l16 16M444 122l-16 16" stroke-width="3"/>
      <path d="M348 178l8 8M356 178l-8 8" stroke-width="3"/>
      <circle cx="280" cy="73" r="1.5"/>
    </svg>
    <h1>SEU CARRINHO ESTÁ VAZIO</h1>
    <p>Faça login para ver o seu carrinho e comece a comprar</p>

    <button class="btn primario" id="btnCadastro">CADASTRAR-SE / REGISTRAR</a>
    <button class="btn secundario" id="btnComprar">COMPRAR AGORA</button>
  </section>
</main>

<div class="modal" id="modal">
  <form id="formLogin">
    <h2 id="tituloModal">Entrar</h2>
    <input type="text" id="nome" placeholder="Nome completo" style="display:none">
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="password" id="senha" placeholder="Senha" required minlength="4">
    <button type="submit" class="btn primario" id="enviar">ENTRAR</button>
    <button type="button" class="troca" id="troca">Não tem conta? Cadastre-se</button>
    <button type="button" class="fechar" id="fechar">Cancelar</button>
  </form>
</div>

<div id="aviso"></div>
</body>
</html>
